[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "kellu"
dynamic = ["version"]
description = "A secure, modular AI assistant for the Kate editor."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Kellu contributors" }]
keywords = ["kate", "kde", "ai", "assistant", "llm", "lsp", "terminal", "security"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development",
    "Typing :: Typed",
]
# The core is standard-library only. Everything heavier is an optional extra.
dependencies = []

[project.optional-dependencies]
tui = ["rich>=13", "prompt_toolkit>=3.0"]
local = []  # reserved for local runtime integrations (planned for 0.5.0)
dev = [
    "pytest>=8",
    "ruff>=0.6",
    "mypy>=1.10",
    "pip-audit>=2.7",
]

[project.scripts]
kellu = "kellu.cli:main"

[project.urls]
# TODO: replace <your-user> before publishing.
Homepage = "https://github.com/<your-user>/kellu"
Issues = "https://github.com/<your-user>/kellu/issues"
Security = "https://github.com/<your-user>/kellu/security/policy"

# ---------------------------------------------------------------- build ----
[tool.hatch.version]
path = "src/kellu/__app__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/kellu"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/packaging",
    "/README.md",
    "/README.es.md",
    "/SECURITY.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

# ---------------------------------------------------------------- tools ----
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "sandbox: tests that need a working bubblewrap sandbox (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
# E/F/W/I/UP/B/SIM: correctness and style. S: bandit security rules.
# TID: bans relative imports so the layer rule can be checked by tests.
select = ["E", "F", "W", "I", "UP", "B", "SIM", "S", "TID"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]
