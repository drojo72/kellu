# Kellu packaged defaults.
# Override any of this in ~/.config/kellu/config.toml (see `kellu config path`).
# Secrets never go in configuration files: use `kellu keys set <name>`.
# `keyring_name = "openrouter"` resolves to the keyring entry `kellu=ai_openrouter_api_key`.

[providers.openrouter]
kind = "openai_compat"
base_url = "https://openrouter.ai/api/v1"
model = "openrouter/auto"
timeout_s = 60
keyring_name = "openrouter"

[providers.deepseek]
kind = "openai_compat"
base_url = "https://api.deepseek.com/v1"
model = "deepseek-chat"
timeout_s = 60
keyring_name = "deepseek"

# Gemini. `gemini-flash-latest` is a Google-maintained alias, so the default keeps working when
# a specific version is retired. Pin an exact model id in config.toml if you need reproducibility.
[providers.google]
kind = "google"
base_url = "https://generativelanguage.googleapis.com/v1beta"
model = "gemini-flash-latest"
timeout_s = 60
keyring_name = "google"

# Gemma 4, served directly by the Gemini API with its own key and quota.
[providers.gemma_direct]
kind = "google"
base_url = "https://generativelanguage.googleapis.com/v1beta"
model = "gemma-4-26b-a4b-it"
timeout_s = 60
keyring_name = "gemma_direct"

# xAI Grok. Model ids change quickly: check the provider's model list and override here.
[providers.grok]
kind = "openai_compat"
base_url = "https://api.x.ai/v1"
model = "grok-4.3"
timeout_s = 60
keyring_name = "grok"

[routing.general]
primary = "gemma_direct"
backup = ["google", "deepseek", "openrouter"]

[routing.code]
primary = "deepseek"
backup = ["openrouter"]

[routing.explain]
primary = "google"
backup = ["openrouter"]

[router]
total_timeout_s = 120

[logging]
level = "INFO"
max_bytes = 1000000
backups = 3

[sessions]
enabled = true
max_entry_chars = 2000
